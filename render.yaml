# ──────────────────────────────────────────────────────────────────────────────
#  render.yaml — Blueprint deploy to Render.com
#
#  FREE-tier strategy:
#    • ONE free web service running the FastAPI backend via Docker
#    • NO managed PostgreSQL (free Postgres expires after 30 days)
#    • NO persistent disk (not available on the free plan) — we use SQLite
#      stored on the container's local filesystem instead.
#
#  Trade-off: SQLite data lives in the container filesystem, so it resets on
#  every redeploy/restart of the service. Fine for demo/dev; add PostgreSQL
#  later if persistence is needed.
# ──────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: health-api
    runtime: docker
    plan: free                      # ← Free instance (512 MB RAM, spins down when idle)
    region: oregon
    dockerfilePath: backend/Dockerfile
    dockerContext: .                # repo root — Dockerfile COPYs backend/ from here
    healthCheckPath: /docs
    autoDeploy: true                # redeploy on every push to main
    envVars:
      - key: JWT_SECRET
        generateValue: true         # ← Render generates a strong random secret
      - key: DATABASE_URL
        value: ""                   # empty → SQLite fallback in db/session.py
      - key: HEALTH_DB_PATH
        value: /home/appuser/app/backend/health.db
      - key: DOCUMENT_STORAGE_PATH
        value: /home/appuser/app/backend/storage/uploads
      - key: PYTHONUNBUFFERED
        value: "1"

