# ──────────────────────────────────────────────────────────────────────────────
#  GitHub Actions — Build & push backend Docker image to GHCR
#  Also supports deploying to Render.com, Fly.io, or Hugging Face Spaces.
#  Triggered on push to main (backend code changes) or via workflow_dispatch.
# ──────────────────────────────────────────────────────────────────────────────
name: Build & Push Backend Docker Image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
      - "render.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extract metadata for Docker
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/health-react-backend
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest

      # 5. Build & push
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Output image URL
      - name: Image digest
        run: echo "Image: ${{ steps.meta.outputs.tags }}"
